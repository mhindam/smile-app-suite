name: Deploy to Lovable

on:
  push:
    branches: [ main ]

permissions: write-all

jobs:
  deploy:
    name: Deploy site to Lovable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Locate and prepare build output
        run: |
          echo "Looking for build output..."
          if [ -d "dist" ]; then
            BUILD_DIR="dist"
            echo "✓ Found build output in ./dist"
          elif [ -d ".output" ]; then
            BUILD_DIR=".output"
            echo "✓ Found build output in ./.output"
          elif [ -d ".output/public" ]; then
            BUILD_DIR=".output/public"
            echo "✓ Found build output in ./.output/public"
          else
            echo "ERROR: Build output directory not found"
            ls -la
            exit 1
          fi

          mkdir -p .deploy
          cd .deploy
          zip -r site.zip ../$BUILD_DIR
          echo "Successfully created site.zip"
          ls -lh site.zip

      - name: Deploy to Lovable
        env:
          DEPLOY_URL: "https://lovable.dev/projects/5d4a9f41-afac-4502-ba79-78ae7e23d10e?magic_link=mc_7991fcc2-27ce-4f00-bd69-bd9e2d16eb61"
        run: |
          echo "Deploying to Lovable via embedded magic link..."
          cd .deploy
          curl -sS -X POST "$DEPLOY_URL" \
            -F "file=@site.zip" \
            -H "Accept: application/json" \
            -w "\nHTTP Status: %{http_code}\n" \
            -o response.json
          echo "Response from Lovable:"
          cat response.json || echo "No response received"

      - name: Deployment status
        if: ${{ always() }}
        run: |
          echo "Deployment attempt completed"
          echo "Check the Lovable project for updates"
