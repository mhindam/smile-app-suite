name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Locate and deploy build output
        run: |
          echo "Looking for build output..."
          if [ -d "dist" ]; then
            BUILD_DIR="dist"
            echo "✓ Found build output in ./dist"
          elif [ -d ".output/public" ]; then
            BUILD_DIR=".output/public"
            echo "✓ Found build output in ./.output/public"
          elif [ -d ".output" ]; then
            BUILD_DIR=".output"
            echo "✓ Found build output in ./.output"
          else
            echo "ERROR: Build output directory not found"
            ls -la
            exit 1
          fi
          
          echo "Build directory: $BUILD_DIR"
          ls -la $BUILD_DIR | head -20

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
